<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n>Transcript · VoiceRecon</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/js/boot.js"></script>
  <link rel="stylesheet" href="/static/css/app.css">
  <script type="module" src="/static/js/history-view.js"></script>
</head>
<body>
  <main class="page">
    <a class="back-link" href="/history" id="back" data-i18n>← All transcripts</a>
    <div class="page-head view-head">
      <div class="grow">
        <input type="text" class="title-input" id="title" maxlength="120" aria-label="Title" data-i18n-attr="aria-label">
        <p class="muted small" id="meta"></p>
        <div class="chips" id="speakers"></div>
      </div>
      <div class="row">
        <a class="btn btn-sm" id="export-txt" title="Text with times" data-i18n-attr="title">TXT</a>
        <a class="btn btn-sm" id="export-srt" title="Subtitles" data-i18n-attr="title">SRT</a>
        <a class="btn btn-sm" id="export-json" title="All data" data-i18n-attr="title">JSON</a>
        <a class="btn btn-sm hidden" id="export-wav" title="The audio of the whole transcript" data-i18n-attr="title">WAV</a>
        <button class="btn btn-sm hidden" id="stop" data-i18n>Stop transcribing</button>
        <button class="btn btn-sm" id="refresh" title="Reload" data-i18n-attr="title"></button>
        <button class="btn btn-sm hidden" id="delete-audio" data-i18n>Delete audio</button>
        <button class="btn btn-sm btn-danger hidden" id="delete" data-i18n>Delete</button>
      </div>
    </div>
    <p class="muted small" data-i18n>Click a name to change who spoke, or a line's pencil to fix its text. Moving lines to a voice also teaches that voice how they sounded.</p>
    <div class="card history-lines" id="lines"></div>
  </main>

  <dialog id="speaker-dialog">
    <div class="dialog-body">
      <h2 data-i18n>Who said this?</h2>
      <div class="scope" id="scope"></div>
      <div class="voice-choices" id="choices"></div>
      <form id="other-form" class="dialog-section">
        <label class="field"><span data-i18n>Someone else</span>
          <input type="text" id="other-name" maxlength="60" autocomplete="off" placeholder="Name" data-i18n-attr="placeholder">
        </label>
        <div class="buttons"><button class="btn" type="submit" data-i18n>Use this name</button></div>
      </form>
      <p class="error-text" id="speaker-error"></p>
      <div class="buttons"><button class="btn" type="button" id="speaker-cancel" data-i18n>Cancel</button></div>
    </div>
  </dialog>
</body>
</html>
