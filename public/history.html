<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n>History · VoiceRecon</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/js/boot.js"></script>
  <link rel="stylesheet" href="/static/css/app.css">
  <script type="module" src="/static/js/history.js"></script>
</head>
<body>
  <main class="page">
    <div class="page-head">
      <div>
        <h1 data-i18n>History</h1>
        <p class="muted" data-i18n>Transcripts are saved automatically while you listen. Recordings can be transcribed too.</p>
      </div>
      <div class="row head-tools">
        <input type="search" id="search" class="search" placeholder="Search all transcripts" aria-label="Search all transcripts" data-i18n-attr="placeholder,aria-label" autocomplete="off">
        <button class="btn btn-primary" id="upload-btn" title="Any audio or video file the browser can play: MP3, M4A, WAV, OGG, FLAC, WebM, …" data-i18n-attr="title"></button>
      </div>
    </div>
    <div class="row filters">
      <label><span data-i18n>Speaker</span>
        <select id="voice-filter" aria-label="Speaker" data-i18n-attr="aria-label"><option value="" data-i18n>Everyone</option></select>
      </label>
      <label><span data-i18n>From</span> <input type="date" id="from-filter"></label>
      <label><span data-i18n>To</span> <input type="date" id="to-filter"></label>
      <button class="btn btn-sm btn-ghost hidden" type="button" id="clear-filters" data-i18n>Clear filters</button>
    </div>
    <p class="muted small" id="note"></p>
    <div class="history-list" id="list"></div>
    <div class="row more-row"><button class="btn hidden" id="more" data-i18n>Show more</button></div>
  </main>
</body>
</html>
