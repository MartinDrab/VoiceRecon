# Fast checks for every push and pull request: lint, type checks and the tests that need no
# speech models, also the browser tests (the speech tests skip themselves here; they run nightly
# in speech-tests.yml).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22 # the oldest supported version (node:sqlite needs 22.13 or newer)
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-tests-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  deb:
    # The Debian package (npm run deb), installed on Ubuntu as a user would: Node.js from NodeSource,
    # then the package, whose service starts (and begins downloading the speech models).
    name: Debian package (build, install, purge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run deb -- --maintainer "VoiceRecon CI <ci@example.invalid>"
      - name: Inspect
        run: |
          dpkg-deb --info dist/voicerecon_*_amd64.deb
          dpkg-deb --contents dist/voicerecon_*_amd64.deb | grep -E 'bin/voicerecon|voicerecon.service|voicerecon.env|sherpa-onnx-linux-x64/sherpa-onnx.node'
      - name: Install
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
          sudo apt-get install -y nodejs
          sudo apt-get install -y ./dist/voicerecon_*_amd64.deb
      - name: The service runs as voicerecon and starts downloading the models
        run: |
          systemctl is-enabled voicerecon
          id voicerecon
          stat -c '%U %a %n' /var/lib/voicerecon /var/lib/voicerecon/data /var/lib/voicerecon/models
          for i in $(seq 1 30); do sudo journalctl -u voicerecon --no-pager | grep -q 'Downloading the speech models' && break; sleep 1; done
          sudo journalctl -u voicerecon --no-pager | tail -5
          sudo journalctl -u voicerecon --no-pager | grep -q 'Downloading the speech models'
          sudo systemctl stop voicerecon
      - name: The app works on Linux from the package
        run: |
          sudo -u voicerecon /usr/bin/node -e "require('/usr/lib/voicerecon/node_modules/sherpa-onnx-node'); console.log('sherpa-onnx loads')"
          sudo -u voicerecon env DATA_DIR=/var/lib/voicerecon/data MODELS_DIR=/var/lib/voicerecon/models /usr/bin/node /usr/lib/voicerecon/src/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/setup && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/api/setup | grep -q '"needed":true'
          sudo env VOICERECON_PASSWORD=ci-test-password voicerecon create-user admin --admin
          curl -sf http://127.0.0.1:3000/api/setup | grep -q '"needed":false'
          sudo voicerecon backup
          ls -l /var/lib/voicerecon/backups/*.tar
          sudo pkill -f /usr/lib/voicerecon/src/server.js || true
          cat server.log
      - name: Purge keeps the data
        run: |
          sudo apt-get purge -y voicerecon
          if systemctl list-unit-files voicerecon.service | grep -q voicerecon; then echo 'the service is still there'; exit 1; fi
          test ! -e /etc/voicerecon/voicerecon.env
          test ! -e /usr/bin/voicerecon
          test -f /var/lib/voicerecon/data/voicerecon.db
